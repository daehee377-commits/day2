<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #fff8ef; height: 100vh; display: flex; flex-direction: column; }
    header { background: #ff8a3d; color: #fff; padding: .9rem 1rem; text-align: center; font-weight: bold; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; max-width: 700px; width: 100%; margin: 0 auto; }
    .msg { max-width: 75%; padding: .6rem .9rem; border-radius: 16px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .me { align-self: flex-end; background: #ff8a3d; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; color: #222; border: 1px solid #f0dcc4; border-bottom-left-radius: 4px; }
    form { display: flex; gap: .5rem; padding: .7rem 1rem; background: #fff; border-top: 1px solid #eee; max-width: 700px; width: 100%; margin: 0 auto; }
    input { flex: 1; padding: .65rem .9rem; border: 1px solid #ddd; border-radius: 999px; font-size: 1rem; }
    button { padding: .6rem 1.2rem; border: 0; border-radius: 999px; background: #ff6b35; color: #fff; font-size: 1rem; cursor: pointer; }
    .note { text-align: center; font-size: .72rem; color: #999; padding: .4rem 1rem .7rem; background: #fff; }
  </style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 나오는 답은 미리 정해 둔 가짜 답이에요.</div>

  <script>
    const REPLIES = [
      '안녕하세요, 김도현 님! 🍊 제주 특산물을 알아봐 드리는 에이전트예요. 어떤 특산물이 궁금하세요? (예: 귤, 갈치, 흑돼지)',
      '제주에 가신다면 한라봉을 추천해요! 🍋 1월~4월쯤 가장 맛있고, 향이 진하고 달아요.',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    let turn = 0;

    function add(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, 'me');
      input.value = '';
      const reply = REPLIES[turn % REPLIES.length];
      turn++;
      setTimeout(() => add(reply, 'bot'), 1000);
    });
  </script>
</body>
</html>
