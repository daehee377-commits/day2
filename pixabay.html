<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixabay 이미지 슬라이더</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Malgun Gothic", sans-serif; margin: 0; padding: 1rem; background: #f4f6f8; color: #222; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.4rem; text-align: center; }
    .bar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .bar input { flex: 1 1 200px; padding: .6rem .8rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .bar button { padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #2f6fed; color: #fff; font-size: 1rem; cursor: pointer; }
    .bar button:disabled { background: #aaa; cursor: not-allowed; }
    #status { text-align: center; color: #666; min-height: 1.5rem; margin: .5rem 0; }
    .viewport { overflow: hidden; border-radius: 12px; }
    .slide { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; animation: in .35s ease; }
    @keyframes in { from { opacity: 0; transform: translateX(var(--dir, 40px)); } to { opacity: 1; transform: none; } }
    .slide a { display: block; aspect-ratio: 1; overflow: hidden; border-radius: 8px; background: #ddd; }
    .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nav { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1rem; }
    .nav button { padding: .5rem 1.2rem; border: 1px solid #2f6fed; background: #fff; color: #2f6fed; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .nav button:disabled { opacity: .4; cursor: not-allowed; }
    .credit { text-align: center; font-size: .8rem; color: #888; margin-top: 1.5rem; }
    @media (max-width: 720px) { .slide { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🖼️ Pixabay 이미지 슬라이더</h1>

    <!-- API 키는 아래 칸에 붙여넣거나, API_KEY 상수에 직접 넣으세요 -->
    <div class="bar">
      <input id="key" type="password" placeholder="Pixabay API 키" autocomplete="off">
      <input id="q" type="text" placeholder="검색어 (예: 제주도, 귤, tangerine)">
      <button id="go">검색</button>
    </div>

    <div id="status"></div>
    <div class="viewport"><div id="slide" class="slide"></div></div>

    <div class="nav">
      <button id="prev" disabled>◀ 이전 10개</button>
      <span id="page"></span>
      <button id="next" disabled>다음 10개 ▶</button>
    </div>

    <div class="credit">이미지 제공: <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a></div>
  </div>

  <script>
    const API_KEY = '';           // 여기에 직접 넣어도 됩니다 (배포·공유 시에는 넣지 마세요)
    const PER_PAGE = 10;          // 한 슬라이드에 보여 줄 이미지 수

    const $ = id => document.getElementById(id);
    let query = '', page = 1, total = 0;

    function getKey() { return API_KEY || $('key').value.trim(); }

    async function load(p, dir) {
      const key = getKey();
      if (!key) { $('status').textContent = 'API 키를 입력해 주세요.'; return; }
      if (!query) { $('status').textContent = '검색어를 입력해 주세요.'; return; }

      $('status').textContent = '불러오는 중…';
      $('prev').disabled = $('next').disabled = $('go').disabled = true;

      const url = 'https://pixabay.com/api/?' + new URLSearchParams({
        key, q: query, image_type: 'photo', per_page: PER_PAGE, page: p, safesearch: 'true'
      });

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status === 400 ? 'API 키 또는 요청이 올바르지 않습니다.' :
                                     res.status === 429 ? '요청이 너무 많습니다. 잠시 후 다시 시도하세요.' : '오류 ' + res.status);
        const data = await res.json();
        page = p; total = data.totalHits;
        render(data.hits, dir);
        const last = Math.max(1, Math.ceil(total / PER_PAGE));
        $('page').textContent = total ? `${page} / ${last} 페이지 (총 ${total}장)` : '';
        $('status').textContent = total ? '' : '검색 결과가 없습니다.';
        $('prev').disabled = page <= 1;
        $('next').disabled = page >= last;
      } catch (e) {
        $('status').textContent = e.message || '불러오지 못했습니다.';
      } finally {
        $('go').disabled = false;
      }
    }

    function render(hits, dir) {
      const el = $('slide');
      el.style.setProperty('--dir', dir === 'prev' ? '-40px' : '40px');
      el.replaceWith(el.cloneNode(false));          // 애니메이션 다시 실행
      const slide = $('slide');
      slide.innerHTML = '';
      hits.forEach(h => {
        const a = document.createElement('a');
        a.href = h.pageURL; a.target = '_blank'; a.rel = 'noopener'; a.title = h.tags;
        const img = document.createElement('img');
        img.src = h.webformatURL; img.alt = h.tags; img.loading = 'lazy';
        a.appendChild(img); slide.appendChild(a);
      });
    }

    function search() { query = $('q').value.trim(); page = 1; load(1, 'next'); }

    $('go').addEventListener('click', search);
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    $('prev').addEventListener('click', () => load(page - 1, 'prev'));
    $('next').addEventListener('click', () => load(page + 1, 'next'));
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' && !$('prev').disabled) $('prev').click();
      if (e.key === 'ArrowRight' && !$('next').disabled) $('next').click();
    });
  </script>
</body>
</html>
